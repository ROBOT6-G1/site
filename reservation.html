<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation / Devis - DEVWEB Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen">
  <nav class="fixed top-0 left-0 right-0 z-50 glass-nav py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="text-2xl font-black gradient-text flex items-center gap-2">
        <i class="fa-solid fa-code text-purple-500"></i> DEVWEBIA
      </a>
      <a href="index.html" class="text-sm font-bold text-slate-400 hover:text-white">
        <i class="fa-solid fa-arrow-left mr-2"></i> Hiverina
      </a>
    </div>
  </nav>

  <main class="flex-grow pt-32 pb-20 px-6 max-w-3xl mx-auto w-full">
    <div class="glass-card p-8 sm:p-12 rounded-3xl space-y-8 border border-slate-700/60 shadow-2xl">
      <div class="text-center space-y-2">
        <h1 class="text-3xl font-extrabold">Manao <span class="gradient-text">Rendez-vous</span> / Devis</h1>
        <p class="text-slate-400 text-sm">Fenoina ireto antsipiriany ireto mba hahafahanay mifandray aminao.</p>
      </div>

      <form id="booking-form" class="space-y-6">
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-2">Anarana feno</label>
            <input type="text" id="b-name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:border-purple-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-2">Laharana Telefaonina</label>
            <input type="tel" id="b-phone" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:border-purple-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-2">Serivisy Ilaina</label>
          <select id="b-service" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:border-purple-500 focus:outline-none">
            <option value="Site Vitrine">Site Vitrine / Entreprise</option>
            <option value="E-Commerce">Boutique E-Commerce</option>
            <option value="Application Web">Application Web Sur-Mesure</option>
            <option value="Design UX/UI">Design UX/UI</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-2">Daty Tiana Hifanaovana Foana</label>
          <input type="date" id="b-date" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:border-purple-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full gradient-bg py-4 rounded-xl font-bold text-white shadow-xl hover:opacity-90 transition">
          Hanamafy ny Rendez-vous
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
